# Variables for this play live in inventory/group_vars/orchestrator.yml. Every role except common/core and
# common/user is gated behind a 'never' tag, so it only runs when its tag is named explicitly.
- name: Orchestrator
  hosts: orchestrator
  become: true
  gather_facts: true

  tasks:
    - name: Provision system
      block:
        - name: Include common/core
          ansible.builtin.include_role:
            name: common/core
            apply:
              tags: [ always, core ]
          tags: [ always, core ]

        - name: Include common/user
          ansible.builtin.include_role:
            name: common/user
            public: true
            apply:
              tags: [ always, user ]
          tags: [ always, user ]

        - name: Include common/ssh
          ansible.builtin.include_role:
            name: common/ssh
            apply:
              tags: [ never, ssh ]
          tags: [ never, ssh ]

        - name: Include common/nvidia-stack
          ansible.builtin.include_role:
            name: common/nvidia-stack
            apply:
              tags: [ never, nvidia-stack ]
          tags: [ never, nvidia-stack ]

        - name: Include common/podman
          ansible.builtin.include_role:
            name: common/podman
            apply:
              tags: [ never, podman ]
          tags: [ never, podman ]

        - name: Include orchestrator/rke2
          ansible.builtin.include_role:
            name: orchestrator/rke2
            apply:
              tags: [ never, rke2 ]
          tags: [ never, rke2 ]

      always:
        - name: Include common/cleanup
          ansible.builtin.include_role:
            name: common/cleanup
            apply:
              tags: [ never, cleanup ]
          tags: [ never, cleanup ]
