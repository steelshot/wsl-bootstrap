- name: Resolve Windows host identity
  ansible.builtin.include_tasks: "{{ project_dir }}/tasks/windows-user.yml"

# bootstrap.ps1 -Teardown removes the entries by this name, so the two must stay in step.
- name: Set Windows host kubeconfig facts
  ansible.builtin.set_fact:
    rke2_host_kubeconfig_path: "{{ windows_user_profile }}/.kube/config"
    rke2_host_kubeconfig_name: rke2

- name: Install host kubeconfig synchronization script
  ansible.builtin.template:
    src: kubeconfig-sync.sh.j2
    dest: /usr/local/sbin/rke2-kubeconfig-sync
    owner: root
    group: root
    mode: "0755"

- name: Install host kubeconfig synchronization units
  ansible.builtin.template:
    src: "{{ item.src }}"
    dest: "/etc/systemd/system/{{ item.dest }}"
    mode: "0644"
  loop:
    - src: kubeconfig-sync.service.j2
      dest: rke2-kubeconfig-sync.service
    - src: kubeconfig-sync.path.j2
      dest: rke2-kubeconfig-sync.path

- name: Enable host kubeconfig synchronization
  ansible.builtin.include_tasks: "{{ project_dir }}/tasks/systemd-services.yml"
  vars:
    systemd_services:
      names:
        - rke2-kubeconfig-sync.path
      daemon_reload: true

- name: Enable host kubeconfig synchronization service
  ansible.builtin.systemd_service:
    name: rke2-kubeconfig-sync.service
    enabled: true

- name: Synchronize the host kubeconfig
  ansible.builtin.command:
    argv:
      - /usr/local/sbin/rke2-kubeconfig-sync
  register: rke2_kubeconfig_sync
  changed_when: "'updated' in rke2_kubeconfig_sync.stdout"
