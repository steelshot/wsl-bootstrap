- name: Set the requested GPU Operator version
  ansible.builtin.set_fact:
    rke2_gpu_operator_requested: "{{ (rke2.gpu_operator_version | default('latest') | string | trim) or 'latest' }}"

- name: Query the NVIDIA Helm repository index
  ansible.builtin.uri:
    url: https://helm.ngc.nvidia.com/nvidia/index.yaml
    return_content: true
  register: rke2_gpu_operator_index
  until: rke2_gpu_operator_index is succeeded
  retries: 5
  delay: 5
  when: rke2_gpu_operator_requested == 'latest'

- name: Resolve the GPU Operator chart version
  ansible.builtin.set_fact:
    rke2_gpu_operator_version: >-
      {{
        rke2_gpu_operator_requested
        if rke2_gpu_operator_requested != 'latest'
        else 'v' ~ ((rke2_gpu_operator_index.content | from_yaml).entries['gpu-operator']
                    | map(attribute='version') | map('regex_replace', '^v', '')
                    | reject('search', '-') | list
                    | community.general.version_sort | last)
      }}

- name: Ensure containerd template directory exists
  ansible.builtin.file:
    path: /var/lib/rancher/rke2/agent/etc/containerd
    state: directory
    mode: "0755"

- name: Deploy containerd NVIDIA default-runtime template
  ansible.builtin.copy:
    src: config-v3.toml.tmpl
    dest: /var/lib/rancher/rke2/agent/etc/containerd/config-v3.toml.tmpl
    mode: "0644"
  register: rke2_containerd_template

- name: Deploy GPU Operator HelmChart
  ansible.builtin.template:
    src: gpu-operator.yml.j2
    dest: /var/lib/rancher/rke2/server/manifests/gpu-operator.yml
    mode: "0644"

- name: Deploy WSL2 NodeFeatureRule
  ansible.builtin.copy:
    src: node-feature-rule.yml
    dest: /var/lib/rancher/rke2/server/manifests/node-feature-rule.yml
    mode: "0644"
