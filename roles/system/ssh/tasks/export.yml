- name: Resolve Windows host identity
  ansible.builtin.include_tasks: "{{ project_dir }}/tasks/windows-user.yml"

- name: Set host export facts
  ansible.builtin.set_fact:
    ssh_export_directory: "{{ windows_user_profile }}/.ssh"
    ssh_export_subdirectory: wsl
    ssh_export_key_name: "{{ ssh.key.name | default('id_' ~ user.name) }}"
    ssh_export_alias: "{{ ssh.export.alias | default('') or wsl_distribution }}"
    ssh_export_hostname: "{{ ssh.export.hostname | default('localhost') | lower }}"
    ssh_export_port: "{{ ssh.service.port | default(('2' ~ user.uid) | int) | int }}"

- name: Set the host key name used by the Windows SSH client
  ansible.builtin.set_fact:
    ssh_export_known_host: "{{ ssh_export_hostname if (ssh_export_port | int) == 22 else '[' ~ ssh_export_hostname ~ ']:' ~ ssh_export_port }}"

- name: Assert host export alias is usable
  ansible.builtin.assert:
    that:
      - ssh_export_alias | length > 0
      - ssh_export_alias is not search('\\s')
    fail_msg: >-
      ssh.export.alias must be a single whitespace-free token; the WSL distribution name
      "{{ wsl_distribution }}" cannot be used as an SSH Host alias.

- name: Ensure host SSH directories exist
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
  loop:
    - "{{ ssh_export_directory }}"
    - "{{ ssh_export_directory }}/{{ ssh_export_subdirectory }}"

# The copy module's remote_src mode fails on the 9p-mounted Windows drive with ENOENT, so the files are compared and
# copied with the coreutils instead.
- name: Compare the managed SSH identity with the Windows host copy
  ansible.builtin.command:
    argv:
      - cmp
      - --silent
      - "{{ user.home }}/.ssh/{{ ssh_export_key_name }}{{ item }}"
      - "{{ ssh_export_directory }}/{{ ssh_export_subdirectory }}/{{ ssh_export_key_name }}{{ item }}"
  register: ssh_export_comparison
  changed_when: false
  failed_when: ssh_export_comparison.rc not in [0, 1, 2]
  loop:
    - ""
    - .pub

- name: Export managed SSH identity to the Windows host
  ansible.builtin.command:
    argv:
      - cp
      - --force
      - "{{ user.home }}/.ssh/{{ ssh_export_key_name }}{{ item.item }}"
      - "{{ ssh_export_directory }}/{{ ssh_export_subdirectory }}/{{ ssh_export_key_name }}{{ item.item }}"
  when: item.rc != 0
  changed_when: true
  loop: "{{ ssh_export_comparison.results }}"
  loop_control:
    label: "{{ ssh_export_key_name }}{{ item.item }}"

- name: Include exported SSH configuration from the host client configuration
  ansible.builtin.lineinfile:
    path: "{{ ssh_export_directory }}/config"
    regexp: "^\\s*Include\\s+{{ ssh_export_subdirectory }}/\\*\\.conf\\s*$"
    line: "Include {{ ssh_export_subdirectory }}/*.conf"
    insertbefore: BOF
    create: true

- name: Register host SSH configuration entry
  ansible.builtin.copy:
    dest: "{{ ssh_export_directory }}/{{ ssh_export_subdirectory }}/{{ ssh_export_alias }}.conf"
    content: |
      Host {{ ssh_export_alias }}
          HostName {{ ssh_export_hostname }}
          AddressFamily inet
          Port {{ ssh_export_port }}
          User {{ user.name }}
          IdentityFile ~/.ssh/{{ ssh_export_subdirectory }}/{{ ssh_export_key_name }}
          IdentitiesOnly yes
