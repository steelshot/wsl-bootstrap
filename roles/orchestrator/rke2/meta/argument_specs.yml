argument_specs:
  main:
    short_description: Install and validate the local RKE2 control plane.
    description: Installs RKE2, configures manifests, waits for Kubernetes readiness, and optionally configures GPU and kubeconfig export support.
    options:
      rke2:
        type: dict
        required: true
        description: RKE2 role configuration.
        options:
          version:
            type: str
            required: true
            description: RKE2 channel or version label.
          gpu_operator_version:
            type: str
            required: true
            description: NVIDIA GPU Operator chart version.
          kubeconfig_sync:
            type: bool
            default: true
            description: Whether to synchronize the generated kubeconfig to the current Windows profile.
