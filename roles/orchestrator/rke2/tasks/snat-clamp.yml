- name: Install pod SNAT port clamp unit
  ansible.builtin.template:
    src: wsl-snat-clamp.service.j2
    dest: /etc/systemd/system/wsl-snat-clamp.service
    mode: "0644"

- name: Enable pod SNAT port clamp
  ansible.builtin.include_tasks: "{{ project_dir }}/tasks/systemd-services.yml"
  vars:
    systemd_services:
      names:
        - wsl-snat-clamp.service
      daemon_reload: true
