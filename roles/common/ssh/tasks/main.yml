- name: Assert managed user data is available
  ansible.builtin.assert:
    that:
      - user.name is defined
      - user.home is defined
      - user.uid is defined
      - user.gid is defined
    fail_msg: user must be enriched by common/user before including common/ssh.

- name: Install SSH packages
  ansible.builtin.include_tasks: "{{ project_dir }}/tasks/zypper-packages.yml"
  vars:
    zypper:
      packages:
        - openssh

- name: Ensure managed SSH directory exists
  ansible.builtin.file:
    path: "{{ user.home }}/.ssh"
    state: directory
    owner: "{{ user.name }}"
    group: "{{ user.name }}"
    mode: "0700"

- name: Generate managed SSH identity
  community.crypto.openssh_keypair:
    path: "{{ user.home }}/.ssh/{{ ssh.key.name | default('id_' ~ user.name) }}"
    type: ed25519
    comment: "{{ user.name }}@{{ ansible_hostname }}"
    owner: "{{ user.name }}"
    group: "{{ user.name }}"
    mode: "0600"

- name: Authorise generated SSH public key
  ansible.posix.authorized_key:
    user: "{{ user.name }}"
    key: "file://{{ user.home }}/.ssh/{{ ssh.key.name | default('id_' ~ user.name) }}.pub"
    state: present
    manage_dir: false

- name: Configure Windows host SSH access
  ansible.builtin.include_tasks:
    file: export.yml
  when: ssh.export.enabled | default(false) | bool

- name: Create managed SSH access group
  ansible.builtin.group:
    name: "{{ ssh.service.group | default('ssh-users') }}"
    system: true

- name: Add managed user to SSH access group
  ansible.builtin.user:
    name: "{{ user.name }}"
    groups: "{{ ssh.service.group | default('ssh-users') }}"
    append: true

- name: Configure key-only SSH access for managed users
  ansible.builtin.template:
    src: sshd.conf.j2
    dest: /etc/ssh/sshd_config.d/90-managed-user-access.conf
    owner: root
    group: root
    mode: "0644"
  register: ssh_server_configuration

- name: Enable SSH service for managed users
  ansible.builtin.systemd:
    name: sshd.service
    enabled: true
    state: "{{ 'restarted' if ssh_server_configuration.changed else 'started' }}"
