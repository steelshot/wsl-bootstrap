- name: Resolve Windows host identity
  ansible.builtin.include_tasks: "{{ project_dir }}/tasks/windows-user.yml"

- name: Read WSL distribution root path
  ansible.builtin.command:
    argv:
      - wslpath
      - -w
      - /
  register: ssh_wsl_distribution_root
  changed_when: false

- name: Set host export facts
  ansible.builtin.set_fact:
    ssh_export_directory: "{{ windows_user_profile }}/.ssh"
    ssh_export_key_name: "{{ ssh.key.name | default('id_' ~ user.name) }}"
    ssh_export_distribution: '{{ ssh_wsl_distribution_root.stdout.strip().strip("\\").split("\\") | last }}'

- name: Set host export alias
  ansible.builtin.set_fact:
    ssh_export_alias: "{{ ssh.export.alias | default('') or ssh_export_distribution }}"

- name: Assert host export alias is usable
  ansible.builtin.assert:
    that:
      - ssh_export_alias | length > 0
      - ssh_export_alias is not search('\\s')
    fail_msg: >-
      ssh.export.alias must be a single whitespace-free token; the WSL distribution name
      "{{ ssh_export_distribution }}" cannot be used as an SSH Host alias.

- name: Ensure host SSH directory exists
  ansible.builtin.file:
    path: "{{ ssh_export_directory }}"
    state: directory

- name: Compare the managed SSH identity with the Windows host copy
  ansible.builtin.command:
    argv:
      - cmp
      - --silent
      - "{{ user.home }}/.ssh/{{ ssh_export_key_name }}{{ item }}"
      - "{{ ssh_export_directory }}/{{ ssh_export_key_name }}{{ item }}"
  register: ssh_export_comparison
  changed_when: false
  failed_when: ssh_export_comparison.rc not in [0, 1, 2]
  loop:
    - ""
    - .pub

- name: Export managed SSH identity to the Windows host
  ansible.builtin.command:
    argv:
      - cp
      - --force
      - "{{ user.home }}/.ssh/{{ ssh_export_key_name }}{{ item.item }}"
      - "{{ ssh_export_directory }}/{{ ssh_export_key_name }}{{ item.item }}"
  when: item.rc != 0
  changed_when: true
  loop: "{{ ssh_export_comparison.results }}"
  loop_control:
    label: "{{ ssh_export_key_name }}{{ item.item }}"

- name: Register host SSH configuration entry
  ansible.builtin.blockinfile:
    path: "{{ ssh_export_directory }}/config"
    marker: "# {mark} ANSIBLE MANAGED BLOCK {{ ssh_export_alias }}"
    insertbefore: BOF
    create: true
    block: |
      Host {{ ssh_export_alias }}
          HostName {{ ssh.export.hostname | default('localhost') }}
          AddressFamily inet
          Port {{ ssh.service.port | default(22222) }}
          User {{ user.name }}
          IdentityFile ~/.ssh/{{ ssh_export_key_name }}
          IdentitiesOnly yes
