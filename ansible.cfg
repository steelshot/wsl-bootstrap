# This repository is normally reached through a DrvFs mount under /mnt/c, which is world writable, and Ansible
# deliberately ignores an ansible.cfg it discovers in a world writable working directory. Point ANSIBLE_CONFIG at this
# file so that it is honoured regardless:
#
#     ANSIBLE_CONFIG=./ansible.cfg ansible-playbook site.yml --limit workstation

[defaults]
inventory = inventory/hosts.yml
roles_path = roles
interpreter_python = auto_silent
