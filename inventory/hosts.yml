# Each distribution provisions itself from inside itself, so this inventory exists to name the two provisioning
# targets and to give their variables somewhere to live, not to describe machines that can be reached over a network.
# Both hosts are therefore local, and a run selects one of them with --limit workstation or --limit orchestrator.
#
# Pinning the interpreter to the one running ansible-playbook keeps interpreter discovery out of the picture, so the
# collections installed by the bootstrap are always importable by the modules that need them.
all:
  vars:
    ansible_connection: local
    ansible_python_interpreter: "{{ ansible_playbook_python }}"
  children:
    workstation:
      hosts:
        wsl-workstation:
    orchestrator:
      hosts:
        wsl-orchestrator:
